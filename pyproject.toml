[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "doctor-trigger"
version = "0.1.0"
description = "Doctor Trigger: a framework for release-bound face verification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Chia-Ming Lee" },
    { name = "Chia-Yu Lin" },
    { name = "Hung-Kai Huang" },
    { name = "Yi-Ting Ku" },
    { name = "Yu-Chen Liang" },
    { name = "Chih-Chung Hsu" },
]
# The method itself (spectrum, key, record, enrollment, readings, calibration, decision, channels,
# config, manifests) needs only these.
dependencies = [
    "numpy",
    "pillow",
    "scikit-image",
    "pyyaml",
    "pandas",
]

[project.optional-dependencies]
# the record model f_θ (doctor_trigger.record_model)
record-model = ["torch"]
# experiments: image-only detector, ArcFace control, metrics, swap engines
experiments = [
    "torch",
    "torchvision",
    "scikit-learn",
    "insightface",
    "onnxruntime-gpu",
    "opencv-python",
    "matplotlib",
]
test = ["pytest"]

[project.scripts]
doctor-trigger = "doctor_trigger.cli:main"

[tool.setuptools]
packages = ["doctor_trigger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
